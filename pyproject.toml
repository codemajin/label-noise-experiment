[project]
name = "label-noise-experiment"
version = "0.1.0"
description = "Experiments on combining cleanlab (Confident Learning) with biquality-learn without human verification"
readme = "README.md"
authors = [
    { name = "codemajin" }
]
requires-python = ">=3.11"
dependencies = [
    "biquality-learn>=0.1.0",
    "cleanlab>=2.9.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "scikit-learn>=1.4,<1.6",
    "tabulate>=0.10.0",
]

[project.scripts]
label-noise-experiment = "label_noise_experiment:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
